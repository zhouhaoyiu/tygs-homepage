name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6
      with:
        version: 11.15.1
    - name: Use Node.js 26
      uses: actions/setup-node@v6
      with:
        node-version: 26.x
        cache: pnpm

    - run: pnpm install --frozen-lockfile
    - run: pnpm run lint
    - run: pnpm build
